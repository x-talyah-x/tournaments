<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Basil's Billiards Tournament Hub - Entries and Player Management">
  <title>Basil's Billiards - Tournament Hub</title>
  
  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Paystack Inline JS SDK -->
  <script src="https://js.paystack.co/v1/inline.js"></script>
  
  <!-- Load client application logic -->
  <script src="server.js" defer></script>
  
  <style>
    :root {
      --bg: #070b12;
      --card-bg: #0f172a;
      --surface: #020617;
      --text: #f8fafc;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --border: #1e293b;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { 
      box-sizing: border-box; 
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: clamp(0.75rem, 3vw, 2.5rem) clamp(0.5rem, 2vw, 1rem);
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 750px;
      background: var(--card-bg);
      border-radius: clamp(10px, 2vw, 16px);
      padding: clamp(1rem, 4vw, 2rem);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
      border: 1px solid var(--border);
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 1rem;
      width: 100%;
    }

    .brand-logo {
      max-width: clamp(80px, 15vw, 120px);
      height: auto;
      margin: 0 auto 0.5rem auto;
      display: block;
    }

    .action-corner-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: #94a3b8;
      padding: clamp(6px, 1.5vw, 8px) clamp(10px, 2vw, 14px);
      border-radius: 20px;
      font-size: clamp(0.75rem, 2vw, 0.85rem);
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    
    .action-corner-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .header {
      text-align: center;
      margin-top: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      margin: 0.25rem 0;
      font-size: clamp(1.35rem, 5vw, 2.25rem);
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .header h3 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(0.85rem, 3vw, 1.1rem);
      text-transform: uppercase;
    }

    .admin-panel, .player-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: clamp(0.85rem, 3vw, 1.25rem);
      margin-bottom: 1.5rem;
    }

    .admin-panel.visible, .player-panel.visible { 
      display: block; 
    }

    /* Fully responsive form grid layout */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .panel-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .tournament-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: clamp(1rem, 3vw, 1.25rem);
      margin-bottom: 1.5rem;
    }

    .tournament-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .tournament-card h4 {
      margin: 0;
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: #fff;
    }

    .tournament-badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }

    .badge {
      background: #1e293b;
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: clamp(0.7rem, 2vw, 0.8rem);
      font-weight: 600;
    }

    .input-field, .select-field {
      padding: 10px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: clamp(0.85rem, 2.5vw, 0.95rem);
      width: 100%;
      box-sizing: border-box;
      min-height: 42px;
    }

    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      white-space: nowrap;
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.2s ease;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-primary { background: var(--accent); color: #020617; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }

    .table-wrapper { 
      width: 100%; 
      overflow-x: auto; 
      margin-top: 1rem;
      -webkit-overflow-scrolling: touch; 
    }

    .leaderboard { 
      width: 100%; 
      border-collapse: collapse; 
      min-width: 320px;
    }

    .leaderboard th, .leaderboard td { 
      padding: clamp(6px, 2vw, 10px); 
      text-align: left; 
      font-size: clamp(0.8rem, 2vw, 0.9rem);
    }

    .leaderboard th { 
      border-bottom: 2px solid var(--border); 
      color: #64748b; 
      font-size: clamp(0.7rem, 2vw, 0.8rem); 
      text-transform: uppercase; 
    }

    .admin-col { display: none; text-align: right; }
    .admin-mode-active .admin-col { display: table-cell; }

    /* Flexible Filter Bar */
    .filter-container {
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-container label {
      font-size: clamp(0.8rem, 2.5vw, 0.9rem);
      color: #94a3b8;
      font-weight: 600;
    }

    .filter-container select {
      flex: 1;
      min-width: 140px;
    }

    /* Paystack Modal & Viewport Responsiveness Overrides */
    iframe[name="paystack-iframe-dialog"],
    iframe[id^="paystack"] {
      max-width: 100vw !important;
      max-height: 100vh !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 999999 !important;
    }

    /* Small Screen Specific Adjustments */
    @media (max-width: 480px) {
      body {
        padding: 0.5rem;
      }

      .top-actions {
        flex-wrap: nowrap;
      }
      
      .action-corner-btn span:last-child {
        font-size: 0.75rem;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .filter-container {
        flex-direction: row;
        align-items: center;
      }

      .filter-container select, 
      .filter-container button {
        width: auto;
      }
    }
  </style>
</head>
<body id="app-body">

  <div class="container">
    <div class="top-actions">
      <button id="player-profile-btn" class="action-corner-btn" onclick="togglePlayerProfilePanel()">
        <span>👤</span> <span>Sign Up / Log In</span>
      </button>
      <button id="admin-toggle-btn" class="action-corner-btn" onclick="toggleAdminPrompt()">
        <span>🔒</span> <span id="admin-btn-label">Admin Login</span>
      </button>
    </div>

    <div class="header">
      <img src="logo.png" alt="Basil's Billiards Logo" class="brand-logo" onerror="this.style.display='none'">
      <h1>Basil's Billiards</h1>
      <h3>Upcoming Tournament Entries</h3>
    </div>

    <!-- Player Profile Panel -->
    <div id="player-panel" class="player-panel">
      <div class="panel-header-row">
        <h4 style="color:var(--accent); margin:0;">👤 Account Setup</h4>
        <button type="button" class="btn btn-primary" onclick="togglePlayerProfilePanel()">Close</button>
      </div>

      <!-- Auth Mode Switcher -->
      <div style="display: flex; gap: 10px; margin-bottom: 1rem;">
        <button type="button" id="tab-login-btn" class="btn btn-primary" style="flex: 1;" onclick="switchAuthTab('login')">Log In</button>
        <button type="button" id="tab-signup-btn" class="btn btn-secondary" style="flex: 1;" onclick="switchAuthTab('signup')">Sign Up</button>
      </div>

      <!-- Log In Form -->
      <form id="login-form" onsubmit="handleLogIn(event)">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <input type="email" id="login-email" class="input-field" placeholder="Email Address" required aria-label="Email Address">
          <input type="password" id="login-password" class="input-field" placeholder="Password" required aria-label="Password">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 10px;">Log In</button>
      </form>

      <!-- Sign Up Form -->
      <form id="signup-form" onsubmit="handleSignUp(event)" style="display: none;">
        <div class="form-grid">
          <input type="text" id="p-name" class="input-field full-width" placeholder="First Name" required aria-label="First Name">
          <input type="text" id="p-surname" class="input-field full-width" placeholder="Surname" required aria-label="Surname">
          <input type="email" id="p-email" class="input-field full-width" placeholder="Email Address" required aria-label="Email Address">
          <input type="password" id="p-password" class="input-field full-width" placeholder="Password" minlength="6" required aria-label="Password">
          
          <select id="p-gender" class="select-field full-width" required aria-label="Gender">
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>

          <input type="date" id="p-dob" class="input-field full-width" required aria-label="Date of Birth">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 10px;">Create Profile</button>
      </form>

      <!-- User Status Header -->
      <div id="auth-user-status" style="margin-top: 1rem; text-align: center; display: none;">
        <p style="color: var(--success); font-size: 0.9rem;" id="logged-in-user-text"></p>
        
        <!-- Notification Preference Toggle -->
        <div style="display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 10px 14px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 12px;">
          <label for="p-notifications" style="font-size: 0.9rem; color: var(--text); cursor: pointer;">
            🔔 Enable Notifications
          </label>
          <input type="checkbox" id="p-notifications" style="width: 18px; height: 18px; cursor: pointer;" onchange="handleToggleNotifications(this.checked)">
        </div>
        
        <button type="button" class="btn btn-danger" onclick="handleLogOut()" style="width: 100%;">Log Out</button>
      </div>
    </div> <!-- Added missing closing tag for #player-panel -->

    <!-- Admin Panel -->
    <div id="admin-panel" class="admin-panel">
      <div class="panel-header-row">
        <h4 style="color: var(--accent); margin: 0;">⚡ Create New Tournament</h4>
        <button type="button" class="btn btn-secondary" onclick="logoutAdmin()">Exit Admin Mode</button>
      </div>

      <form onsubmit="handleCreateTournament(event)">
        <div class="form-grid">
          <input 
            type="text" 
            id="t-name" 
            class="input-field full-width" 
            placeholder="Tournament Name (e.g. Ladies Night Special)" 
            required 
            aria-label="Tournament Name"
          >

          <input 
            type="datetime-local" 
            id="t-date" 
            class="input-field" 
            required
            aria-label="Event Date and Time"
          >

          <select id="t-game" class="select-field" required aria-label="Game Type">
            <option value="Blackball">Blackball</option>
            <option value="8 Ball">8 Ball</option>
            <option value="9 Ball">9 Ball</option>
            <option value="Heyball">Heyball</option>
            <option value="Ultimate Pool">Ultimate Pool</option>
          </select>

          <input 
            type="number" 
            id="t-race" 
            class="input-field" 
            placeholder="Race To (e.g. 5)" 
            min="1" 
            step="1" 
            required
            aria-label="Race To"
          >

          <select id="t-format" class="select-field" required aria-label="Format">
            <option value="Knockouts">Knockouts</option>
            <option value="Round Robin">Round Robin</option>
          </select>

          <select id="t-target-gender" class="select-field" required aria-label="Target Gender">
            <option value="All">Open / All Genders</option>
            <option value="Female">Female Only (Ladies)</option>
            <option value="Male">Male Only (Mens)</option>
          </select>

          <input 
            type="number" 
            id="t-entry" 
            class="input-field" 
            placeholder="Entry Fee (R)" 
            min="0" 
            step="1" 
            required
            aria-label="Entry Fee"
          >

          <div class="full-width" style="display: flex; align-items: center; gap: 8px; margin-top: 5px;">
            <input type="checkbox" id="t-is-doubles" style="width: 18px; height: 18px; cursor: pointer;">
            <label for="t-is-doubles" style="font-size: 0.9rem; color: var(--text); cursor: pointer;">Doubles Competition</label>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Publish Tournament</button>
      </form>

      <hr style="border: 0; border-top: 1px solid var(--border); margin: 2rem 0 1.5rem 0;">

      <!-- Admin Refund Management Section -->
      <div>
        <div class="panel-header-row" style="margin-bottom: 0.5rem;">
          <h4 style="color: var(--gold); margin: 0; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px;">
            💳 Pending & Processed Refunds
          </h4>
          <button type="button" class="btn btn-secondary" onclick="loadRefundRequests()" style="padding: 4px 10px; font-size: 0.8rem; min-height: 32px;">
            🔄 Refresh List
          </button>
        </div>
        
        <div id="admin-refunds-container"></div>
      </div>
    </div>

    <!-- Date Filter Control -->
    <div class="filter-container">
      <label for="date-filter">Filter by Date:</label>
      <select id="date-filter" class="select-field" onchange="renderTournaments()">
        <option value="">All Dates</option>
        <option value="today">Today</option>
        <option value="tomorrow">Tomorrow</option>
        <option value="this_week">This Week</option>
        <option value="this_month">This Month</option>
      </select>
      <button type="button" class="btn btn-secondary" onclick="clearDateFilter()">Clear</button>
    </div>

    <!-- Active Tournaments List -->
    <div id="tournaments-container"></div>
  </div>

</body>
</html>
