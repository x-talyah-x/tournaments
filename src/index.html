<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Basil's Billiards - Tournament Hub</title>
  
  <!-- Supabase JS Client library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Load your app logic -->
  <script src="server.js" defer></script>
  
  <style>
    :root {
      --bg: #070b12;
      --card-bg: #0f172a;
      --text: #f8fafc;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --border: #1e293b;
      --danger: #ef4444;
      --success: #22c55e;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: clamp(1rem, 3vw, 2.5rem) 0.75rem;
      margin: 0;
      min-height: 100vh;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 700px;
      background: var(--card-bg);
      border-radius: 16px;
      padding: clamp(1.25rem, 4vw, 2rem);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.15);
      border: 1px solid var(--border);
    }

   .top-actions {
      position: absolute;
      top: 1rem;
      left: 1rem;
      right: 1rem;
      display: flex;
      justify-content: space-between;
      pointer-events: none; /* Allows clicks through container padding */
    }

    .action-corner-btn {
      pointer-events: auto; /* Enables clicks on buttons */
      background: #020617;
      border: 1px solid var(--border);
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    
    .action-corner-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .header {
      text-align: center;
      margin-top: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .header h1 {
      margin: 0.25rem 0;
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .header h3 {
      margin: 0;
      color: var(--accent);
      font-size: clamp(0.9rem, 3vw, 1.1rem);
      text-transform: uppercase;
    }

    .admin-panel, .player-panel {
      display: none;
      background: #020617;
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .admin-panel.visible, .player-panel.visible { display: block; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .tournament-card {
      background: #020617;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }

    .tournament-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .tournament-card h4 {
      margin: 0;
      font-size: 1.1rem;
      color: #fff;
    }

    .tournament-badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }

    .badge {
      background: #1e293b;
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .signup-form {
      display: grid;
      grid-template-columns: 2fr 1fr 1.2fr auto;
      gap: 8px;
      margin-top: 1rem;
    }

    .input-field, .select-field {
      padding: 10px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 0.9rem;
      width: 100%;
    }

    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    .btn {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .btn-primary { background: var(--accent); color: #020617; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-secondary { background: #334155; color: #fff; }

    .table-wrapper { width: 100%; overflow-x: auto; margin-top: 1rem; }
    .leaderboard { width: 100%; border-collapse: collapse; }
    .leaderboard th, .leaderboard td { padding: 10px; text-align: left; }
    .leaderboard th { border-bottom: 2px solid var(--border); color: #64748b; font-size: 0.8rem; text-transform: uppercase; }

    .admin-col { display: none; text-align: right; }
    .admin-mode-active .admin-col { display: table-cell; }

    .filter-container {
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    @media (max-width: 580px) {
      .form-grid { grid-template-columns: 1fr; }
      .signup-form { grid-template-columns: 1fr 1fr; }
      .signup-form button { grid-column: span 2; }
    }
  </style>
</head>
<body id="app-body">

  <div class="container">
   <div class="top-actions">
      <button id="player-profile-btn" class="action-corner-btn" onclick="togglePlayerProfilePanel()">
        <span>👤</span> <span>Sign Up/Log In</span>
      </button>
      <button id="admin-toggle-btn" class="action-corner-btn" onclick="toggleAdminPrompt()">
        <span>🔒</span> <span id="admin-btn-label">Admin Login</span>
      </button>
    </div>

    <div class="header">
      <h1>Basil's Billiards</h1>
      <h3>Upcoming Tournament Entries</h3>
    </div>

    <!-- Player Profile Panel -->
    <div id="player-panel" class="player-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h4 style="color:var(--accent); margin:0;">👤 Account Setup</h4>
        <button class="btn btn-secondary" onclick="togglePlayerProfilePanel()">Close</button>
      </div>

      <!-- Auth Mode Switcher -->
      <div style="display: flex; gap: 10px; margin-bottom: 1rem;">
         <button type="button" id="tab-login-btn" class="btn btn-secondary" style="flex: 1;" onclick="switchAuthTab('login')">Log In</button>
        <button type="button" id="tab-signup-btn" class="btn btn-primary" style="flex: 1;" onclick="switchAuthTab('signup')">Sign Up</button>
       
      </div>

      <!-- Sign Up Form -->
      <form id="signup-form" onsubmit="handleSignUp(event)">
        <div class="form-grid">
          <input type="text" id="p-name" class="input-field" placeholder="Full Name" required style="grid-column: span 2;">
          <input type="email" id="p-email" class="input-field" placeholder="Email Address" required style="grid-column: span 2;">
          <input type="password" id="p-password" class="input-field" placeholder="Password" minlength="4" required style="grid-column: span 2;">
          
          <select id="p-gender" class="select-field" required>
            <option value="" disabled selected>Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>

          <input type="date" id="p-dob" class="input-field" required title="Date of Birth">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 10px;">Create Profile</button>
      </form>

      <!-- Log In Form -->
      <form id="login-form" onsubmit="handleLogIn(event)" style="display: none;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <input type="email" id="login-email" class="input-field" placeholder="Email Address" required>
          <input type="password" id="login-password" class="input-field" placeholder="Password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 10px;">Log In</button>
      </form>

      <!-- User Status Header -->
      <div id="auth-user-status" style="margin-top: 1rem; text-align: center; display: none;">
        <p style="color: var(--success); font-size: 0.9rem;" id="logged-in-user-text"></p>
        <button class="btn btn-danger" onclick="handleLogOut()" style="width: 100%;">Log Out</button>
      </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="admin-panel">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h4 style="color:var(--accent); margin:0;">⚡ Create New Tournament</h4>
        <button class="btn btn-secondary" onclick="logoutAdmin()">Exit Admin Mode</button>
      </div>
      
      <form onsubmit="handleCreateTournament(event)">
        <div class="form-grid">
          <input type="text" id="t-name" class="input-field" placeholder="Tournament Name (e.g. Ladies Night Special)" required style="grid-column: span 2;">
          <input type="datetime-local" id="t-date" class="input-field" required>
          
          <select id="t-game" class="select-field" required>
            <option value="Blackball">Blackball</option>
            <option value="8 Ball">8 Ball</option>
            <option value="9 Ball">9 Ball</option>
            <option value="Heyball">Heyball</option>
            <option value="Ultimate Pool">Ultimate Pool</option>
          </select>

          <input type="number" id="t-race" class="input-field" placeholder="Race To (e.g. 5)" min="1" step="1" required>

          <select id="t-format" class="select-field" required>
            <option value="Knockouts">Knockouts</option>
            <option value="Round Robin">Round Robin</option>
          </select>

          <select id="t-target-gender" class="select-field" required style="grid-column: span 2;">
            <option value="All">Open / All Genders</option>
            <option value="Female">Female Only (Ladies)</option>
            <option value="Male">Male Only (Mens)</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; margin-top: 10px;">Publish Tournament</button>
      </form>
    </div>

    <!-- Date Filter Control -->
    <div class="filter-container">
      <label for="date-filter" style="font-size: 0.9rem; color: #94a3b8; font-weight: 600;">Filter by Date:</label>
      <select id="date-filter" class="select-field" style="max-width: 200px;" onchange="renderTournaments()">
        <option value="">All Dates</option>
        <option value="today">Today</option>
        <option value="tomorrow">Tomorrow</option>
        <option value="this_week">This Week</option>
        <option value="this_month">This Month</option>
      </select>
      <button class="btn btn-secondary" onclick="clearDateFilter()">Clear</button>
    </div>

    <!-- Active Tournaments List (Single Instance) -->
    <div id="tournaments-container"></div>
  </div>

</body>
</html>
