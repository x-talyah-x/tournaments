<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basil's Billiards - Tournaments</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    /* Signup Form Layout */
    .signup-form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 1rem;
    }

    .select-field, .input-field {
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 0.9rem;
      width: 100%;
    }

    .select-field:focus, .input-field:focus {
      outline: none;
      border-color: #38bdf8;
    }

    .table-wrapper {
      overflow-x: auto;
      margin-top: 1rem;
    }

    .leaderboard {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .leaderboard th, .leaderboard td {
      padding: 10px 12px;
      border-bottom: 1px solid #1e293b;
    }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      text-transform: capitalize;
    }

    @media (max-width: 580px) {
      .signup-form {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Basil's Billiards</h1>
      <p>Tournament Registrations & Management</p>
    </header>

    <main id="app">
      <!-- Tournaments will render dynamically here -->
      <div id="tournaments-list"></div>
    </main>
  </div>

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="server.js"></script>
</body>
</html>
